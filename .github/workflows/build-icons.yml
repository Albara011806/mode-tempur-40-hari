name: Build installable PWA icons
on:
  push:
    paths:
      - 'icon.svg'
      - '.github/workflows/build-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render PNG icons
        run: |
          python -m pip install cairosvg
          python - <<'PY'
          import cairosvg
          for size in (192,512):
              cairosvg.svg2png(url='icon.svg',write_to=f'icon-{size}.png',output_width=size,output_height=size)
          PY
      - name: Publish generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Build installable PNG icons"
            git push
          fi
